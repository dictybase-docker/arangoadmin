name: Unit testing
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: check out code
        uses: actions/checkout@v6
      - name: set up golang
        uses: actions/setup-go@v6
        with:
          go-version: 1.25
      - name: unit test
        run: go test -v ./...
